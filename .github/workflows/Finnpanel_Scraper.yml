name: Update Finnpanel Data

on:
  schedule:
    - cron: '0 1 * * *'   # joka päivä klo 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write           # tarvitaan epäonnistumisilmoitukseen

concurrency:
  group: finnpanel-scrape
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Finnpanel
        id: scrape
        run: python FPGH.py

      # Runs even if the scrape reported problems: whatever was written should
      # still make it into the archive and into git. A missed day cannot be
      # backfilled, so partial data always beats no data.
      - name: Rebuild consolidated archive
        if: always() && steps.scrape.outcome != 'skipped'
        run: python build_archive.py

      - name: Update README
        if: always() && steps.scrape.outcome != 'skipped'
        run: python update_readme.py

      - name: Commit and push
        if: always() && steps.scrape.outcome != 'skipped'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finnpanel data $(date -u +%Y-%m-%d)"
          # Rebase onto anything that landed while we were scraping, then push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::error::Could not push after 3 attempts"
          exit 1

      # A daily job whose failures are invisible will eventually fail
      # invisibly. This makes it impossible to miss.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Scraper failed: ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'The daily Finnpanel scrape did not complete cleanly.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Finnpanel only publishes a rolling window, so a missed day cannot',
              'be backfilled. Check promptly.',
              '',
              'Note: if the scraper stays broken and commits stop for 60 days,',
              'GitHub disables the schedule automatically and it must be',
              're-enabled by hand in the Actions tab.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'scraper-failure'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['scraper-failure']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body
              });
            }
