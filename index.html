<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnpanel Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --main-blue: #0f2d52;
            --accent-grey: #23272f;
            --accent-blue: #e0e7ff;
            --white: #fff;
            --border-grey: #e5e7eb;
        }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #f8fafc;
            color: var(--accent-grey);
        }
        h1 {
            font-size: 2.2rem;
            color: var(--main-blue);
            margin-bottom: 0.1em;
            margin-top: 0.4em;
        }
        .subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent-grey);
            background: var(--accent-blue);
            display: inline-block;
            border-radius: 7px;
            padding: 4px 14px 3px 10px;
            margin-bottom: 1.1em;
            margin-left: 2px;
        }
        .controls { 
            margin-bottom: 20px; 
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001;
            padding: 14px 12px 10px 12px;
        }
        select, button, input[type="date"] { 
            margin-right: 10px; 
            padding: 7px 12px;
            border-radius: 5px;
            border: 1px solid var(--border-grey);
            background: var(--white);
            font-size: 1rem;
            color: var(--accent-grey);
        }
        button {
            background: var(--main-blue);
            color: var(--white);
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        #loading { 
            display: none; 
            margin-bottom: 10px; 
            color: var(--main-blue);
        }
        #timeframe { 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: var(--accent-grey);
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            background: var(--white);
            border-radius: 10px;
            box-shadow: 0 1px 7px #0001;
            overflow: hidden;
        }
        th, td { 
            border: 1px solid var(--border-grey); 
            padding: 9px 8px; 
            text-align: left; 
        }
        th { 
            background-color: var(--accent-blue); 
            color: var(--accent-grey); 
            font-weight: bold;
        }
        tr:nth-child(even) { 
            background-color: #f3f7fb; 
        }
        tr:hover td {
            background: #f1f5ff;
            transition: background 0.15s;
        }
        /* Footer styles */
        footer {
            margin-top: 36px;
            padding: 17px 0 8px 0;
            text-align: center;
            font-size: 0.99rem;
            color: #777;
        }
        .footer-link {
            color: #1e40af;
            text-decoration: none;
            border-bottom: 1px dotted var(--main-blue);
            transition: color 0.2s;
        }
        .footer-link:hover {
            color: #111;
        }
        @media (max-width: 650px) {
            h1 { font-size: 1.3rem; }
            .subtitle { font-size: 0.98rem; }
            th, td { font-size: 0.94rem; }
            .controls { font-size: 0.97rem; }
        }
    </style>
</head>
<body>
    <h1>Finnpanel Dashboard</h1>
    <div class="subtitle">Yle Areenan, MTV Katsomon ja Ruudun katsotuimmat ohjelmat 2.9.24 alkaen</div>
    <div id="timeframe"></div>
    
    <div class="controls">
        <input type="date" id="dateSelect">
        <select id="dataRange">
            <option value="14D">14 Days</option>
            <option value="90D">90 Days</option>
        </select>
        <select id="service">
            <option value="all">All Services</option>
            <option value="Ruutu">Ruutu</option>
            <option value="MTV Katsomo">MTV Katsomo</option>
            <option value="Yle Areena">Yle Areena</option>
        </select>
        <button onclick="downloadXLSX()">Download Data</button>
    </div>

    <div id="loading">Loading data...</div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Rank</th>
                <th>Service</th>
                <th>Program</th>
                <th>Episode</th>
                <th>Duration</th>
                <th>Viewers</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <footer>
        Vibe coded by 
        <a class="footer-link" href="https://www.linkedin.com/in/joonakortesmaki/" target="_blank" rel="noopener">Joona Kortesmäki</a>
    </footer>

    <script>
        let allData = [];
        const baseUrl = 'https://raw.githubusercontent.com/jondeman/Finnpanel-Scraper/main/';

        // Default to yesterday, and bound the picker to the collection window.
        const todayUTC = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('dateSelect');
        dateInput.value = shiftDays(todayUTC, -1);
        dateInput.min = '2024-09-02';
        dateInput.max = todayUTC;

        // Dates are handled as plain YYYY-MM-DD strings throughout. Parsing
        // them with new Date() yields UTC midnight, which the local-time
        // getters then read back as the previous day for anyone west of UTC.
        function formatDate(value) {
            if (typeof value === 'string') return value.slice(0, 10);
            const d = new Date(value);
            return [d.getUTCFullYear(),
                    String(d.getUTCMonth() + 1).padStart(2, '0'),
                    String(d.getUTCDate()).padStart(2, '0')].join('-');
        }

        function shiftDays(dateStr, delta) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const t = Date.UTC(y, m - 1, d) + delta * 86400000;
            return formatDate(new Date(t));
        }

        function updateTimeframeDisplay() {
            const el = document.getElementById('timeframe');
            const selected = document.getElementById('dateSelect').value;
            const days = document.getElementById('dataRange').value === '14D' ? 14 : 90;

            // Files from 2026-08-21 onwards carry the measurement window that
            // Finnpanel actually published. Older files do not, so the window
            // has to be inferred -- and the inference is approximate: the real
            // period typically ends a day or two before the collection date.
            const withPeriod = allData.find(r => r.PeriodStart && r.PeriodEnd);
            if (withPeriod) {
                el.textContent = `Measured period: ${formatDate(withPeriod.PeriodStart)} – ${formatDate(withPeriod.PeriodEnd)}`;
                el.title = `Collected ${selected}`;
            } else {
                el.textContent = `Timeframe (approx.): ${shiftDays(selected, -days + 1)} – ${selected}`;
                el.title = 'Files before 2026-08-21 do not record the exact measured period.';
            }
        }

        // Candidate locations, newest layout first. Everything from
        // 2026-08-21 is CSV under data/<year>/; the 1,435 files before that are
        // .xlsx, which lived in the repository root until they were moved into
        // data/<year>/. The root path is kept as a last resort so that any
        // older permalink still resolves.
        function candidates(range, date) {
            const year = date.slice(0, 4);
            return [
                `data/${year}/${range}_Finnpanel_data_${date}.csv`,
                `data/${year}/${range}_Finnpanel_data_${date}.xlsx`,
                `${range}_Finnpanel_data_${date}.xlsx`,
            ];
        }

        function parseSheet(buffer, isCsv) {
            // SheetJS reads CSV and XLSX through the same entry point.
            const wb = isCsv
                ? XLSX.read(new TextDecoder('utf-8').decode(buffer), {type: 'string'})
                : XLSX.read(new Uint8Array(buffer), {type: 'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, blankrows: false});
            if (!rows.length) return [];
            const headers = rows[0];
            return rows.slice(1).map(r => {
                const o = {};
                headers.forEach((h, i) => { o[h] = r[i]; });
                return o;
            });
        }

        async function fetchData() {
            document.getElementById('loading').style.display = 'block';
            allData = [];
            const date = document.getElementById('dateSelect').value;
            const range = document.getElementById('dataRange').value;

            let loaded = false;
            for (const path of candidates(range, date)) {
                try {
                    const response = await fetch(baseUrl + path);
                    if (!response.ok) continue;
                    allData = parseSheet(await response.arrayBuffer(),
                                         path.endsWith('.csv'));
                    loaded = true;
                    break;
                } catch (error) {
                    console.warn(`Could not load ${path}`, error);
                }
            }

            const tableBody = document.getElementById('tableBody');
            if (!loaded) {
                tableBody.innerHTML =
                    `<tr><td colspan="7">No data available for ${date}.</td></tr>`;
                document.getElementById('timeframe').textContent = '';
            } else {
                updateTable();
            }
            updateTimeframeDisplay();
            document.getElementById('loading').style.display = 'none';
        }

        function updateTable() {
            const service = document.getElementById('service').value;
            
            let filteredData = allData;
            if (service !== 'all') {
                filteredData = filteredData.filter(row => row.Service === service);
            }

            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.Date || ''}</td>
                    <td>${row.Rank || ''}</td>
                    <td>${row.Service || ''}</td>
                    <td>${row.Program || ''}</td>
                    <td>${row.Episode || ''}</td>
                    <td>${row.Duration || ''}</td>
                    <td>${(row.Viewers ? parseInt(row.Viewers).toLocaleString() : '')}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        document.getElementById('service').addEventListener('change', updateTable);
        document.getElementById('dateSelect').addEventListener('change', fetchData);
        document.getElementById('dataRange').addEventListener('change', fetchData);

        function downloadXLSX() {
            if (allData.length === 0) {
                alert('No data to download. Please wait for data to load.');
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(allData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Finnpanel Data");
            const selectedDate = document.getElementById('dateSelect').value;
            const dataRange = document.getElementById('dataRange').value;
            XLSX.writeFile(workbook, `${dataRange}_Finnpanel_data_${formatDate(selectedDate)}.xlsx`);
        }

        // Initial load
        fetchData();
    </script>
</body>
</html>
